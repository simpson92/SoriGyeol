<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>소리결 실험 · MediaPipe 버전별 분류 비교</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 16px; max-width: 820px; line-height: 1.5; }
    h1 { font-size: 1.2rem; }
    .box { border: 1px solid #ccc; border-radius: 8px; padding: 12px; margin: 12px 0; }
    .ver a { margin-right: 10px; }
    .ver a.on { font-weight: 700; color: #000; text-decoration: none; border-bottom: 2px solid #2563eb; }
    .ok { color: #0a7d32; font-weight: 600; } .bad { color: #c62828; font-weight: 600; }
    table { border-collapse: collapse; font-size: 0.85rem; width: 100%; }
    td, th { border-bottom: 1px solid #eee; padding: 2px 6px; text-align: right; }
    td:last-child, th:last-child { text-align: left; }
    .hit { background: #e8f5e9; }
    pre { background: #f4f4f4; padding: 10px; border-radius: 6px; white-space: pre-wrap; font-size: 0.85rem; }
    button { font-size: 1rem; padding: 6px 14px; }
  </style>
</head>
<body>
  <h1>MediaPipe 버전별 분류 점수 비교</h1>
  <p>앱과 같은 방식(최근 0.975초 창을 0.5초마다 분류, 클래스 점수 = 묶은 라벨 중 최댓값)으로 파일 전체를 분류해요.
     버전을 바꿔 같은 파일을 두 번 돌려서 숫자를 비교하면 돼요.</p>

  <div class="box ver">버전: <a href="?v=1.2.3" id="v123">1.2.3 (지금 앱)</a><a href="?v=0.10.21" id="v021">0.10.21 (임베딩 가능)</a></div>

  <div class="box">
    <div>1) 모델 준비: <span id="load">불러오는 중…</span></div>
    <div>2) 파일: <input type="file" id="file" accept="audio/*,.wav" disabled></div>
  </div>

  <div class="box">
    <pre id="sum">파일을 골라 주세요</pre>
    <button id="copy" disabled>요약 복사</button>
    <table id="tbl"></table>
  </div>

<script type="module">
const ALLOWED = ['1.2.3', '0.10.21'];
const VER = ALLOWED.includes(new URLSearchParams(location.search).get('v'))
  ? new URLSearchParams(location.search).get('v') : '1.2.3';
document.getElementById(VER === '1.2.3' ? 'v123' : 'v021').classList.add('on');

const CDN = `https://cdn.jsdelivr.net/npm/@mediapipe/tasks-audio@${VER}`;
const MODEL_URL =
  'https://storage.googleapis.com/mediapipe-models/audio_classifier/yamnet/float32/1/yamnet.tflite';
const SR = 16000, WIN = 15600, HOP = SR / 2, THRESHOLD = 0.3; // 앱과 같이 0.975초 창
const $ = (id) => document.getElementById(id);

let classifier, targets, lastCount = 0;

async function load() {
  const t0 = performance.now();
  const { FilesetResolver, AudioClassifier } = await import(`${CDN}/audio_bundle.mjs`);
  const fileset = await FilesetResolver.forAudioTasks(`${CDN}/wasm`);
  classifier = await AudioClassifier.createFromOptions(fileset, {
    baseOptions: { modelAssetPath: MODEL_URL }, maxResults: -1,
  });
  const { classes } = await (await fetch('../classes.json', { cache: 'no-cache' })).json();
  targets = classes.filter((c) => c.enabled && c.priority > 0 && c.yamnet_labels?.length)
    .map((c) => ({ id: c.id, name: c.name_ko, labels: new Set(c.yamnet_labels), threshold: c.threshold ?? THRESHOLD }));
  $('load').innerHTML = `<span class="ok">완료</span> (${Math.round(performance.now() - t0)}ms) · 대상: ${targets.map((t) => t.name).join(', ')}`;
  $('file').disabled = false;
}

async function decode(file) {
  const ctx = new OfflineAudioContext(1, SR, SR);
  const buf = await ctx.decodeAudioData(await file.arrayBuffer());
  const out = new Float32Array(buf.length);
  for (let c = 0; c < buf.numberOfChannels; c++) {
    const ch = buf.getChannelData(c);
    for (let i = 0; i < out.length; i++) out[i] += ch[i] / buf.numberOfChannels;
  }
  return out;
}

// 앱(classifier.js analyze)과 같은 계산: 라벨마다 창 안 결과 중 최댓값 → 클래스 점수 = 묶은 라벨 최댓값
function scoreWindow(samples) {
  const results = classifier.classify(samples, SR);
  lastCount = results.length;
  const best = new Map();
  for (const r of results.slice(0, 1)) { // 앱과 같이 첫 조각만
    for (const c of r.classifications?.[0]?.categories ?? []) {
      if ((best.get(c.categoryName) ?? 0) < c.score) best.set(c.categoryName, c.score);
    }
  }
  const top = [...best.entries()].sort((a, b) => b[1] - a[1])[0] ?? ['-', 0];
  const scores = targets.map((t) => Math.max(0, ...[...t.labels].map((l) => best.get(l) ?? 0)));
  return { scores, top };
}

const pct = (x) => `${(x * 100).toFixed(0)}%`;

async function run(file) {
  const samples = await decode(file);
  const rows = [];
  let ms = 0;
  for (let end = WIN; end <= samples.length; end += HOP) {
    const t = performance.now();
    const r = scoreWindow(samples.subarray(end - WIN, end));
    ms += performance.now() - t;
    rows.push({ sec: end / SR, ...r });
  }

  $('tbl').innerHTML =
    `<tr><th>끝 시각</th>${targets.map((t) => `<th>${t.name}</th>`).join('')}<th>1위 라벨</th></tr>` +
    rows.map((r) => `<tr>${[`<td>${r.sec.toFixed(1)}s</td>`,
      ...r.scores.map((s, i) => `<td class="${s >= targets[i].threshold ? 'hit' : ''}">${pct(s)}</td>`),
      `<td>${r.top[0]} ${pct(r.top[1])}</td>`].join('')}</tr>`).join('');

  const lines = [`[버전] ${VER} · 조각 수 ${lastCount}`, `[파일] ${file.name} · ${(samples.length / SR).toFixed(2)}초 · 창 ${rows.length}개 · 창당 평균 ${(ms / rows.length).toFixed(1)}ms`];
  targets.forEach((t, i) => {
    const v = rows.map((r) => r.scores[i]);
    const hits = v.filter((s) => s >= t.threshold).length;
    lines.push(`[${t.name}] 최고 ${pct(Math.max(...v))} · 평균 ${pct(v.reduce((a, b) => a + b, 0) / v.length)} · 기준(${pct(t.threshold)}) 넘은 창 ${hits}/${v.length}`);
  });
  $('sum').textContent = lines.join('\n');
  $('copy').disabled = false;
}

$('file').addEventListener('change', (e) => {
  const f = e.target.files[0];
  if (f) run(f).catch((err) => { $('sum').innerHTML = `<span class="bad">오류: ${err.message}</span>`; });
});
$('copy').addEventListener('click', async () => {
  await navigator.clipboard.writeText($('sum').textContent);
  $('copy').textContent = '복사됨!';
});
load().catch((err) => { $('load').innerHTML = `<span class="bad">실패: ${err.message}</span>`; });
</script>
</body>
</html>
